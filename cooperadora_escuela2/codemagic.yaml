workflows:
  flutter-android:
    name: Flutter Android App
    max_build_duration: 60
    working_directory: cooperadora_escuela2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build APK (Debug)
        script: |
          flutter build apk --debug
    artifacts:
      - cooperadora_escuela2/build/**/outputs/**/*.apk
