workflows:
  android-apk:
    name: Cooperadora Escuela 2 - APK Android
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generar estructura Android de Flutter
        script: |
          flutter create --platforms=android --org com.cooperadora --project-name cooperadora_escuela2 --no-pub /tmp/cooperadora_android
          cp -R /tmp/cooperadora_android/android .
          sed -i 's/android:label="cooperadora_escuela2"/android:label="Cooperadora Escuela 2"/' android/app/src/main/AndroidManifest.xml
      - name: Obtener dependencias
        script: flutter pub get
      - name: Analizar proyecto
        script: flutter analyze
      - name: Compilar APK release
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
