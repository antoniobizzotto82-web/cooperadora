workflows:
  android-workflow:
    name: Flutter Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
